# Pipeline de la demo (mitarasca.demo.lucianodlf.com.ar). Guía: deploy/demo/deploy.md
#
#   push a rama  -> test
#   push a main  -> test + build (imagen :<sha>)
#   tag vX.Y.Z   -> test + build (imagen :vX.Y.Z y :latest) + release + deploy_demo
#   reseed_demo  -> manual en tags: regenera la demo.db de la VM con el seed de la imagen
#
# Variables de CI/CD requeridas (Settings > CI/CD > Variables, protegidas):
#   SSH_PRIVATE_KEY (File), SSH_KNOWN_HOSTS (File), VPS_HOST, VPS_USER
# Los tags v* deben ser protegidos para que los jobs de deploy vean esas variables.

stages: [test, build, release, deploy]

variables:
  DEMO_DIR: /srv/example-demo
  DEMO_URL: https://mitarasca.demo.lucianodlf.com.ar

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

test:
  stage: test
  image: oven/bun:1.3.14
  before_script:
    # La imagen solo trae un "node" que es Bun (bun-node-fallback-bin); vue-tsc necesita
    # Node real para engancharse a tsc, si no falla con TS2307 en cada import de .vue.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs >/dev/null
    - export PATH="/usr/bin:$PATH" && node --version
  script:
    - bun install --frozen-lockfile
    - bun run typecheck
    - cd packages/core && bun test

build_image:
  stage: build
  image: docker:24.0.5-cli
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        for t in "$CI_COMMIT_TAG" latest; do
          docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$t"
          docker push "$CI_REGISTRY_IMAGE:$t"
        done
      fi

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - echo "Release $CI_COMMIT_TAG -> $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Imagen: `$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG` (commit $CI_COMMIT_SHORT_SHA). Demo: $DEMO_URL"

.ssh_vps:
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client curl
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 600 "$SSH_PRIVATE_KEY"
    - export SSH="ssh -i $SSH_PRIVATE_KEY $VPS_USER@$VPS_HOST"

deploy_demo:
  extends: .ssh_vps
  stage: deploy
  resource_group: demo
  environment:
    name: demo
    url: $DEMO_URL
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  script:
    - scp -i "$SSH_PRIVATE_KEY" deploy/demo/docker-compose.yml "$VPS_USER@$VPS_HOST:$DEMO_DIR/docker-compose.yml"
    - $SSH "cd $DEMO_DIR && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$CI_COMMIT_TAG/' .env && docker compose pull && docker compose up -d --wait --wait-timeout 90"
    - curl -fsS "$DEMO_URL/health"

reseed_demo:
  extends: .ssh_vps
  stage: deploy
  resource_group: demo
  needs: [deploy_demo]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
      when: manual
  script:
    - $SSH "cd $DEMO_DIR && docker compose stop api && docker compose run --rm api bun run packages/core/scripts/seed-demo.ts /app/data/demo.db && docker compose up -d --wait --wait-timeout 90"
    - curl -fsS "$DEMO_URL/health"
