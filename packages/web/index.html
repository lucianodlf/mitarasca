<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiTarasca</title>
    <meta name="description" content="La plata que se va, con nombre y apellido." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Aplica el tema antes del primer render para evitar el flash claro (misma lógica que useTheme).
      try {
        var t = localStorage.getItem("mitarasca:theme");
        if (t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
